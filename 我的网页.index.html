<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>周枫朔 | 个人主页</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"微软雅黑",sans-serif;}
        body{
            background: linear-gradient(135deg,#48c6ef 0%,#6f86d6 100%);
            min-height:100vh;
            padding:40px 20px;
        }
        .container{
            max-width:800px;
            margin:0 auto;
            background:#fff;
            border-radius:20px;
            padding:50px 40px;
            box-shadow:0 8px 32px rgba(0,80,200,0.2);
            animation:float 3s ease-in-out infinite alternate;
        }
        @keyframes float{
            from{transform:translateY(0px);}
            to{transform:translateY(-8px);}
        }
        h1{
            text-align:center;
            color:#ff6b35;
            font-size:38px;
            margin-bottom:15px;
        }
        .tag{
            text-align:center;
            color:#666;
            font-size:17px;
            margin-bottom:40px;
        }
        .info-box{
            margin:30px 0;
            padding:22px;
            border-left:5px solid #ff9500;
            background:#f8fafc;
            border-radius:0 12px 12px 0;
        }
        .info-box h3{
            color:#2563eb;
            margin-bottom:10px;
            font-size:22px;
        }
        .info-box p{
            color:#333;
            line-height:1.8;
            font-size:16px;
        }
        .sport{
            background:linear-gradient(90deg,#ffe8cc,#fff);
            padding:25px;
            border-radius:15px;
            margin-top:35px;
            border:2px dashed #ff7800;
        }
        .sport h3{color:#e65100;margin-bottom:12px;}
        .footer{
            text-align:center;
            margin-top:50px;
            color:#777;
            padding-top:20px;
            border-top:1px solid #eee;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>周枫朔</h1>
        <div class="tag">华中科技大学 · 船舶与海洋工程 | 羽毛球运动爱好者</div>

        <div class="info-box">
            <h3>📖 个人学业</h3>
            <p>就读于华中科技大学船舶与海洋工程专业，钻研船舶构造、海洋流体力学等专业知识，专注工科科研与工程实践学习。</p>
        </div>

        <div class="sport">
            <h3>🏸 兴趣爱好：羽毛球</h3>
            <p>课余长期坚持羽毛球运动，热爱赛场奔跑挥拍，依靠运动舒缓学业压力，用竞技活力保持积极向上的生活状态。</p>
        </div>

        <div class="info-box">
            <h3>🌊 个人寄语</h3>
            <p>心怀远洋造船理想深耕船海专业，怀揣运动热爱奔赴球场，以严谨治学、热血运动充实大学生活。</p>
        </div>

        <div class="footer">
            <p>个人站点 | 基于Github Pages部署上线</p>
        </div>
    </div>
</body>
</html>
